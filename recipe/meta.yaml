{% set name = "7zip" %}
{% set version = "26.02" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ip7z/7zip/releases/download/{{ version }}/7z{{ version.replace('.', '') }}-src.7z
  sha256: c7502dd4557481f52ccf1b3e680329f1fdd207e79a25544afeb3106325474944

build:
  number: 0
  skip: true  # [not win or win32]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  run_constrained:
    - 7za <0.0.0a

test:
  commands:
    - 7z.exe
    - 7za.exe
    - 7zr.exe

about:
  home: https://www.7-zip.org/
  license: LGPL-3.0
  license_family: LGPL
  license_file:
    - LICENSE.txt
    - UNRAR_LICENSE.txt
  description: |
    7-Zip is a file archiver with a high compression ratio.
  summary: 7-Zip is a file archiver with a high compression ratio.
  dev_url: https://github.com/ip7z/7zip
  doc_url: https://www.7-zip.org
extra:
  recipe-maintainers:
    - wolfv